<! DOCTYPE html>
<html>

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title> ANDROID VIEW </title>
<link rel="style/sheet" href="android.css">
<style>
*{
padding: 0% 0%;
margin: 0%;
}

body{
background-color: pink;
height: 100vh;
width: 100%;
color: black;
}




header{
width: 100%;
height: 60px;
background-color: yellow;
display: flex;
justify-content: flex-end;
align-items: right;
}

header.bar{
width: 50px;
height: 50px;
margin: 20px;
display: flex;
justify-content: right;
align-items: right;
flex-direction: column;
}

header.bar.bar1,.bar2,.bar3{
width: 7px;
height: 45px;
background-color: green;
margin: 2px;
border-radius: 4px;
}


.main{
width: 100%;
height: 35vh;
display: flex;
justify-content: right;
align-items: right;
}

img{
width: 500px;
height: 480px;
padding: 1% 0%;
background-image: url(androidback.png);
background-repeat: no repeat;
background-position: left;
backgroung-size: cover;
justify-content: center;
align-items: center;
border-radius: 85%;
border: 5px solid red;
box-shadow: 2px 0px 10px black;
}

.content{
width: 100%;
height: 25vh;
margin: 3px;
padding: 2% 2%;
display: flex;
justify-content: right;
align-items: right;
flex-direction: column;
}

.content div{
font-size: 35px;
font-weight: bolder;

}

.content div span{
color: green;
font-size:  30px;

text-shadow: -2px -2px 0px green;
}

.about{
width: 100%;
height: 10vh;
padding: 20px;
display: flex;
padding: 2% 2%;
justify-content: bottom;
align-items: center;
}

.about p{
font-size: 17px;
font-size: 30px;
color: red;
text-align: bottom;
line-height: 22px;
text-shadow: -2px -2px 0px red;
}

.btn{
width: 100%;
height: 10vh;
display: flex;
justify-content: center;
align-items: bottom;
}

.btn button{
padding: 10px 30px;
font-size: 20px;
font-weight: bold;
border: none;
background-color: white;
border-radius: 15px;
color: red;
box-shadow: 20px 20px 20px yellow;
}

</style>


</head>

<body>

<header> 

<div class="bar">
<div class="bar1"></div>
<div class="bar2"></div>
<div class="bar3"></div>
</div>
</header>



<div class="main">
<div class="circle"></div>
<img src="ENGINEER AMK.jpg">
</div>


<div class="content">
<div> HELLO,<BR> I am </div>
<div> K.A.M KHUZAIFAH <BR> </div>
<div> A Web Developer <span> <br> AND </span> </div>
<div> Python Developer And C/C++ Programmer </div>
</div>

<div class="about">
<p> I build beautiful,respective and high performing web Applications From concept to Deployment.
<br> 
<br> 
FOR MORE DETAILS CALL or WHATSAPP :+256789958889.............</p>
</div>

<div class="btn">
<button> DOWNLOAD MY PROJECTS </button>
</div>

</body>

</html>
